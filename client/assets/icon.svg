<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#05284e"/>
      <stop offset="60%" stop-color="#021226"/>
      <stop offset="100%" stop-color="#010814"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#00efff"/>
    </linearGradient>
    <linearGradient id="fireOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="40%" stop-color="#ff7300"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded app badge -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-opacity="0.45"/>

  <!-- Speed trails -->
  <g opacity="0.35" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="210" x2="140" y2="210"/>
    <line x1="40" y1="256" x2="160" y2="256"/>
    <line x1="70" y1="300" x2="135" y2="300"/>
    <line x1="370" y1="210" x2="450" y2="210"/>
    <line x1="350" y1="256" x2="470" y2="256"/>
    <line x1="375" y1="300" x2="445" y2="300"/>
  </g>

  <!-- Flappy Wings -->
  <!-- Left Wing -->
  <g filter="url(#glow)">
    <path d="M 170 235 L 75 190 Q 60 185 70 205 L 145 255 Z" fill="url(#neonCyan)"/>
    <path d="M 165 260 L 95 235 Q 85 230 92 245 L 150 280 Z" fill="url(#neonCyan)" opacity="0.85"/>
    <path d="M 160 285 L 115 270 Q 105 265 112 278 L 150 300 Z" fill="url(#neonCyan)" opacity="0.65"/>
  </g>

  <!-- Right Wing -->
  <g filter="url(#glow)">
    <path d="M 342 235 L 437 190 Q 452 185 442 205 L 367 255 Z" fill="url(#neonCyan)"/>
    <path d="M 347 260 L 417 235 Q 427 230 420 245 L 362 280 Z" fill="url(#neonCyan)" opacity="0.85"/>
    <path d="M 352 285 L 397 270 Q 407 265 400 278 L 362 300 Z" fill="url(#neonCyan)" opacity="0.65"/>
  </g>

  <!-- Cyber Car Body (Front 3/4 perspective) -->
  <g filter="url(#glow)">
    <!-- Wheels -->
    <rect x="175" y="270" width="28" height="58" rx="8" fill="#030b14" stroke="#00efff" stroke-width="3"/>
    <rect x="309" y="270" width="28" height="58" rx="8" fill="#030b14" stroke="#00efff" stroke-width="3"/>

    <!-- Chassis Body -->
    <path d="M 200 220 L 230 180 L 282 180 L 312 220 L 325 285 L 187 285 Z" fill="#051c36" stroke="url(#neonCyan)" stroke-width="4"/>
    
    <!-- Windshield -->
    <polygon points="234,188 278,188 296,225 216,225" fill="#00efff" fill-opacity="0.35" stroke="url(#neonCyan)" stroke-width="2"/>

    <!-- Hood & Grille -->
    <path d="M 214 232 L 298 232 L 315 285 L 197 285 Z" fill="#09284a" stroke="url(#neonCyan)" stroke-width="3"/>

    <!-- Headlights -->
    <polygon points="204,248 230,248 226,260 200,256" fill="#ffe600" filter="url(#glow)"/>
    <polygon points="308,248 282,248 286,260 312,256" fill="#ffe600" filter="url(#glow)"/>

    <!-- Underglow -->
    <ellipse cx="256" cy="315" rx="65" ry="12" fill="#00efff" opacity="0.75" filter="url(#glow)"/>

    <!-- Front Bumper Splitter -->
    <rect x="190" y="284" width="132" height="12" rx="4" fill="url(#fireOrange)"/>
  </g>

  <!-- Game Title Badge -->
  <text x="256" y="380" font-family="'Montserrat', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">FLAPPY</text>
  <text x="256" y="425" font-family="'Montserrat', sans-serif" font-size="38" font-weight="900" font-style="italic" fill="url(#fireOrange)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">CAR 3D</text>
</svg>
